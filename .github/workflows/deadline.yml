name: deadline
on:
  schedule:
    # Hai nhịp, hai mục đích khác nhau — cron tính theo UTC, +7 ra giờ VN.
    # Cron GitHub CHỈ TRỄ, không bao giờ sớm — và trễ rất nặng, đo trên chính
    # repo này (private, free tier), 3 ngày liền 25-27/09/2026:
    #   hẹn 23:43 UTC -> chạy 01:49 / 02:01 / 01:55 UTC   (trễ ~2h10)
    #   hẹn 11:43 UTC -> chạy 15:55 / 15:06 / 15:48 UTC   (trễ ~3h50)
    # Nên HẸN SỚM HƠN giờ mong muốn đúng bằng mức trễ đã đo. Chạy sớm thì vô
    # hại (cửa sổ tính từ lúc chạy nên chỉ nhìn xa thêm chút), chạy muộn mới
    # hỏng: chuông báo tối từng kêu lúc 22:50 cho deadline 23:00.
    - cron: "50 21 * * *"       # hẹn 04:50 VN, rơi vào ~07:00 — bản tin tuần
    - cron: "7 8 * * *"         # hẹn 15:07 VN, rơi vào ~19:00 — chuông báo gấp
  workflow_dispatch:            # bấm tay, và giữ lịch sống qua mốc 60 ngày
jobs:
  bao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python deadline.py --tu-kiem
      - run: python deadline.py
        env:
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          # Đích nào không đặt secret thì tự bỏ qua. Không đặt cái nào là báo lỗi.
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          # Cửa sổ tùy nhịp: nhịp tối nhìn 1 ngày, còn lại (nhịp sáng và bấm
          # tay) nhìn 7 ngày. Chuỗi cron ở đây phải khớp TỪNG KÝ TỰ với dòng
          # cron bên trên, lệch một dấu cách là lẳng lặng rơi về 7.
          NGAY_TRUOC: ${{ github.event.schedule == '7 8 * * *' && '1' || '7' }}
          # Nhịp tối nói cả khi không có gì. Nhịp sáng thì im, vì bản tin tuần
          # rỗng là chuyện thường và không cần xác nhận.
          BAO_CA_KHI_RONG: ${{ github.event.schedule == '7 8 * * *' && '1' || '' }}
          # Tag để tin nhắn đẩy được thông báo. Để trong Secrets chứ không viết
          # thẳng vào đây: người fork khỏi phải sửa file, và ID cá nhân không
          # nằm trong repo public. Không đặt thì không tag ai.
          DISCORD_TAG: ${{ secrets.DISCORD_TAG }}
          TELEGRAM_TAG: ${{ secrets.TELEGRAM_TAG }}
